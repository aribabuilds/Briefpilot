[tool.black]
line-length = 100
target-version = ["py313"]

[tool.isort]
profile = "black"
line_length = 100
known_first_party = ["app"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.13"
strict = true
plugins = ["pydantic.mypy"]

# No per-module overrides: structlog, fastapi, and pydantic all ship py.typed,
# so their real types are checked. Add an override only for a genuinely
# untyped dependency, and say which one and why.

[tool.pytest.ini_options]
testpaths = ["app/tests"]
pythonpath = ["."]
