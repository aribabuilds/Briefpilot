[tool.black]
line-length = 100
target-version = ["py313"]

[tool.isort]
profile = "black"
line_length = 100
known_first_party = ["app"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.13"
strict = true
plugins = ["pydantic.mypy"]

# structlog, fastapi, and pydantic all ship py.typed, so their real types are
# checked — no override. The two below are genuinely untyped (no stubs, no
# py.typed): pypdfium2 (PDF rasterization) and pytesseract (OCR binding). Both
# are isolated behind our own typed wrappers (services/ingestion.py,
# services/ocr/), so the untyped surface does not leak into the rest of the app.
[[tool.mypy.overrides]]
module = ["pypdfium2.*", "pytesseract.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["app/tests"]
pythonpath = ["."]
