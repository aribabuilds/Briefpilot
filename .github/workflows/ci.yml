name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
      - run: npm run lint
      # Formatting was drifting unnoticed: lint and build both pass on
      # unformatted code, so nothing enforced prettier until this step existed.
      - run: npm run format:check
      - run: npm run build

  backend:
    name: Backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      # Tesseract + German pack so the real OCR integration test runs here (it
      # is skipped locally where the binary is absent). This is what makes CI —
      # not a developer laptop — the source of truth for OCR behavior.
      - run: sudo apt-get update && sudo apt-get install -y tesseract-ocr tesseract-ocr-deu
      - run: pip install -r requirements-dev.txt
      - run: ruff check app
      - run: black --check app
      - run: isort --check-only app
      - run: mypy app
      - run: pytest
      # M12: eval harness. Reuses this job's already-installed Tesseract +
      # dev tools rather than a separate job, since eval/ depends on nothing
      # else. `python run_eval.py` is fast today because eval/golden has 0
      # documents (an honest empty scorecard, not a skip) -- it becomes the
      # real accuracy gate once golden letters exist, without any CI changes.
      - run: ruff check .
        working-directory: eval
      - run: black --check .
        working-directory: eval
      - run: isort --check-only .
        working-directory: eval
      - run: mypy .
        working-directory: eval
      - run: pytest
        working-directory: eval
      - run: python run_eval.py
        working-directory: eval
